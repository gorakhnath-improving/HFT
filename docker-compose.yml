name: finex

services:
  postgres:
    image: postgres:16-alpine
    container_name: finex-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-finex}
      POSTGRES_USER: ${DB_USER:-finex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finex}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - finex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finex} -d ${DB_NAME:-finex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: finex-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.0.7
    container_name: finex-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - finex-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  finex-postgres-data:
  finex-grafana-data:
